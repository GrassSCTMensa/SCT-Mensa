site:
  name: SCT Mensa
  site: 'https://southernctmensa.netlify.app'
  base: '/'
  trailingSlash: false

  # Optional: remove this line entirely if you are not using Google Search Console yet
  googleSiteVerificationId: null

# Default SEO metadata
metadata:
  title:
    default: SCT Mensa
    template: '%s — SCT Mensa'
  description: 'Southern Connecticut Mensa: game nights, trivia, dinners, speakers, and social gatherings for Mensa members and guests.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: SCT Mensa
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
